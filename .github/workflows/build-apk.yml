name: Build Android XR Debug APKs

on:
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-xr-apk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.3"
  GODOT_RELEASE: "4.6.3-stable"
  OPENXR_VENDORS_VERSION: "5.1.0-stable"

jobs:
  build-apk:
    name: Build ${{ matrix.preset }} Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Meta Quest 3
            apk: quest-mr-template.apk
            artifact: quest-mr-template
          - preset: PICO 4 Ultra
            apk: pico4-ultra-mr-template.apk
            artifact: pico4-ultra-mr-template
          - preset: VIVE Focus Vision
            apk: vive-focus-vision-mr-template.apk
            artifact: vive-focus-vision-mr-template
          - preset: Android XR
            apk: android-xr-mr-template.apk
            artifact: android-xr-mr-template

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            build-tools;35.0.1
            platforms;android-35
            cmake;3.10.2.4988404
            ndk;28.1.13356709

      - name: Cache Godot downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/quest-mr-godot
          key: ${{ runner.os }}-godot-${{ env.GODOT_RELEASE }}-openxr-vendors-${{ env.OPENXR_VENDORS_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-godot-${{ env.GODOT_RELEASE }}-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            ${{ runner.os }}-gradle-godot-${{ env.GODOT_RELEASE }}-

      - name: Download Godot and OpenXR Vendors
        shell: bash
        run: |
          set -euo pipefail

          CACHE_DIR="$HOME/.cache/quest-mr-godot"
          mkdir -p "$CACHE_DIR"

          GODOT_ARCHIVE="$CACHE_DIR/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          TEMPLATES_ARCHIVE="$CACHE_DIR/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          VENDORS_ARCHIVE="$CACHE_DIR/godotopenxrvendorsaddon-${OPENXR_VENDORS_VERSION}.zip"

          if [[ ! -s "$GODOT_ARCHIVE" ]]; then
            curl --fail --location --retry 3 \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
              --output "$GODOT_ARCHIVE"
          fi

          if [[ ! -s "$TEMPLATES_ARCHIVE" ]]; then
            curl --fail --location --retry 3 \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" \
              --output "$TEMPLATES_ARCHIVE"
          fi

          if [[ ! -s "$VENDORS_ARCHIVE" ]]; then
            curl --fail --location --retry 3 \
              "https://github.com/GodotVR/godot_openxr_vendors/releases/download/${OPENXR_VENDORS_VERSION}/godotopenxrvendorsaddon.zip" \
              --output "$VENDORS_ARCHIVE"
          fi

      - name: Install Godot and Android export templates
        shell: bash
        run: |
          set -euo pipefail

          CACHE_DIR="$HOME/.cache/quest-mr-godot"
          GODOT_DIR="$RUNNER_TEMP/godot-${GODOT_RELEASE}"
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$GODOT_DIR" "$TEMPLATES_DIR"
          unzip -q -o \
            "$CACHE_DIR/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -d "$GODOT_DIR"
          unzip -q -o -j \
            "$CACHE_DIR/Godot_v${GODOT_RELEASE}_export_templates.tpz" \
            templates/android_debug.apk \
            templates/android_source.zip \
            templates/version.txt \
            -d "$TEMPLATES_DIR"

          GODOT_BIN="$GODOT_DIR/Godot_v${GODOT_RELEASE}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install OpenXR Vendors plugin
        shell: bash
        run: |
          set -euo pipefail

          CACHE_DIR="$HOME/.cache/quest-mr-godot"
          VENDORS_DIR="$RUNNER_TEMP/openxr-vendors-${OPENXR_VENDORS_VERSION}"

          rm -rf "$VENDORS_DIR" addons/godotopenxrvendors
          mkdir -p "$VENDORS_DIR" addons
          unzip -q \
            "$CACHE_DIR/godotopenxrvendorsaddon-${OPENXR_VENDORS_VERSION}.zip" \
            -d "$VENDORS_DIR"
          cp -R "$VENDORS_DIR/asset/addons/godotopenxrvendors" addons/

          test -f addons/godotopenxrvendors/plugin.gdextension

      - name: Build ${{ matrix.preset }} Debug APK
        shell: bash
        env:
          EXPORT_PRESET: ${{ matrix.preset }}
          OUTPUT_APK: build/${{ matrix.apk }}
        run: |
          set -euo pipefail
          mkdir -p build

          "$GODOT_BIN" --headless --path . \
            --install-android-build-template \
            --export-debug "$EXPORT_PRESET" \
            "$OUTPUT_APK"

          test -s "$OUTPUT_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-pr-${{ github.event.pull_request.number || github.run_number }}
          path: build/${{ matrix.apk }}
          if-no-files-found: error
          retention-days: 14
